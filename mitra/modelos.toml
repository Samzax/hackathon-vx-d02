# Quais modelos a Mitra usa e em que ordem. Trocar de modelo é editar este arquivo, não o código.
#
# [catalogo]: cada modelo uma vez, com o ID em cada provedor que o oferece (na ordem em que os
# provedores são tentados) e o preço. As listas das camadas citam o modelo pelo nome do catálogo
# ("nome@esforço" passa o esforço de raciocínio a quem aceita).
#
# A ordem vale para todos; quem atende é decidido na hora: entra só provedor com chave no ambiente, e
# o modelo que o provedor recusar (conta sem acesso, ID que ele não conhece) sai da fila por 30 minutos
# (mitra/ia.py, Disponibilidade). Ex.: na AWS do evento o Bedrock nega o Haiku 5.5; a primeira chamada
# recebe a recusa e as seguintes vão direto ao próximo da lista. Numa conta com o Haiku 5.5 liberado,
# ele atende.
#
# Camada 2: atende quase tudo, e é a lista do Assistente Mitra (mitra/pergunta.py).
# Camada 3: só quando a camada 2 devolve baixa confiança ou o Python reprova a resposta.

# Tarefa sensível leva texto de cliente (licença, documento da operação): em chamada NOVA, só sai para os
# provedores de confiança abaixo (decisão de 7/11/2026). O cache vale para qualquer modelo: resposta já
# paga não leva nada novo a ninguém. Tarefa que não estiver listada é tratada como sensível.
[sensibilidade]
provedores = ["anthropic", "bedrock"]

[tarefas.impacto]
sensivel = false        # ato do DOU e obrigações do catálogo público

[tarefas.descoberta]
sensivel = false        # ementa e texto de norma publicada

[tarefas.extrator]
sensivel = false        # texto de norma pública

[tarefas.evidencia]
sensivel = true         # documento da operação da cliente

[tarefas.condicionantes]
sensivel = true         # licença da cliente (o CPF já vira marcador antes, mesmo assim)

[camadas.2]
modelos = ["haiku-5.5", "sonnet-5", "opus-5", "deepseek-v4.1-flash@high", "deepseek-chat"]

[camadas.3]
modelos = ["sonnet-5.5", "opus-5", "deepseek-reasoner", "deepseek-v4.1-flash@max"]

# preço: US$ por milhão de tokens (entrada, saída), para medir o custo de cada chamada.
# Fonte: https://opencode.ai/zen/go/v1/models e páginas de preço dos provedores (nov/2026).
# Bedrock pela API Converse: perfis de inferência us.*. Sonnet 5 e Opus 5 conferidos com chamada real
# na conta do evento em 7/11/2026; os IDs 5.5 seguem o mesmo padrão (a conta do evento nega os dois).
[catalogo."haiku-5.5"]
bedrock   = "us.anthropic.claude-haiku-5-5"
anthropic = "claude-haiku-5-5"
opencode  = "claude-haiku-5-5"
preco     = [0.10, 0.50]

[catalogo."sonnet-5.5"]
bedrock   = "us.anthropic.claude-sonnet-5-5"
anthropic = "claude-sonnet-5-5"
preco     = [2.00, 10.00]

[catalogo."sonnet-5"]
bedrock   = "us.anthropic.claude-sonnet-5"
anthropic = "claude-sonnet-5"
preco     = [2.00, 10.00]

[catalogo."opus-5"]
bedrock   = "us.anthropic.claude-opus-5"
anthropic = "claude-opus-5"
preco     = [5.00, 25.00]

[catalogo."deepseek-v4.1-flash"]
opencode  = "deepseek-v4.1-flash"
preco     = [0.15, 0.60]

[catalogo."deepseek-chat"]
deepseek  = "deepseek-chat"
preco     = [0.15, 0.60]

[catalogo."deepseek-reasoner"]
deepseek  = "deepseek-reasoner"
preco     = [0.66, 1.98]

# formato: "openai" (/chat/completions) ou "anthropic" (/messages).
[provedores.deepseek]
chave = "DEEPSEEK_API_KEY"
formato = "openai"
base = "https://api.deepseek.com/v1"

[provedores.anthropic]
chave = "ANTHROPIC_API_KEY"
formato = "anthropic"
base = "https://api.anthropic.com/v1"

[provedores.bedrock]
# Amazon Bedrock pela API Converse (boto3). "chave" aqui não é chave: MITRA_BEDROCK=1 liga o provedor.
# A credencial vem do perfil AWS do ambiente (AWS_PROFILE) e nunca vai para o .env nem para o código.
chave = "MITRA_BEDROCK"
formato = "bedrock"
regiao = "us-east-1"
intervalo_minimo_s = 1.1      # regra do evento: menos de 1 requisição por segundo

[provedores.opencode]
# O plano Go é voltado a agentes de programação: o cliente precisa se identificar
# e mandar um ID de sessão estável (x-opencode-session).
chave = "OPENCODE_API_KEY"
formato = "openai"
base = "https://opencode.ai/inference/go/openai/v1"
base_anthropic = "https://opencode.ai/inference/go/anthropic/v1"
modelos_anthropic = ["claude-haiku-5-5", "minimax-m3", "qwen3.8-max", "qwen3.8-flash", "qwen3.7-plus"]
cabecalho_sessao = "x-opencode-session"

# Preço de modelo fora do catálogo (o do catálogo vale primeiro).
[precos]
