[[norma]]
chave = "MG:DEC:48078/2020"
jurisdicao = "MG"
fonte = "almg"
titulo = "Decreto MG 48.078/2020"
ementa = "Regulamenta os procedimentos para análise e aprovação do Plano de Ação de Emergência – PAE, estabelecido no art. 9º da Lei nº 23.291, de 25 de fevereiro de 2019, que instituiu a Política Estadual de Segurança de Barragens."
indexacao = "Meio Ambiente. Mineração. Barragem de Rejeitos. Barragem Hídrica. /Tema/Meio Ambiente/Gestão Ambiental/Licenciamento Ambiental /Tema/Mineração/Barragem de Rejeitos /Tema/Saneamento Básico/Abastecimento de Água/Barragem Hídrica /Tema/Segurança Pública/Defesa Civil/Plano de Ação de Emergência (PAE) /Tema/Meio Ambiente/Degradação Ambiental/Desastre Ambiental/Rompimento de Barragem Regulamenta os procedimentos para análise e aprovação do Plano de Ação de Emergência - PAE - estabelecido na Política Estadual de Segurança de Barragens. O PAE tem como objetivos garantir a segurança das pessoas, preservar o meio ambiente e proteger o patrimônio cultural. O PAE deve abranger diversos aspectos, como a instalação de sistemas de alerta, medidas para resgate de pessoas e animais, mitigação de impactos ambientais, garantia de abastecimento de água potável e preservação do patrimônio cultural. O processo de apresentação, análise e aprovação do PAE está vinculado aos procedimentos de licenciamento ambiental de instalação e operação de barragens. Estabelece também a competência de cada órgão na análise do PAE, a periodicidade de revisão do plano, as situações de emergência e os procedimentos a serem adotados em cada caso. Além disso, destaca a importância da transparência, participação social e controle nas ações preventivas e emergenciais, com a obrigação de divulgação do PAE em meio digital e físico."
candidata = true
relevante = true

