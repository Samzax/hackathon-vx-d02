# Avaliação do "Pergunte à torre" (regulaia/pergunta.py) contra a demo (Mineradora Serra Azul, hoje
# 2026-11-07). Os fatos esperados vêm das ferramentas, não de memória: conferidos com a API da demo.
#
#   contem       cada item precisa aparecer na resposta (lista dentro da lista = basta uma das opções)
#   nao_contem   não pode aparecer
#   ferramentas  precisa ter usado (lista dentro da lista = qualquer uma delas)
#
# Além disso, todo caso exige a conferência limpa: trecho entre aspas, data e código da resposta precisam
# estar no que as ferramentas devolveram.
#
# Com o modelo de verdade: REGULAIA_BEDROCK=1 AWS_PROFILE=vx uv run python -m regulaia.pergunta avaliar
# (--gravar regrava tests/fixtures/pergunta/, que o CI repete sem chave).

[[caso]]
id = "atrasadas-b3"
pergunta = "O que está atrasado na B3 e por qual artigo?"
contem = ["R95-01", "R95-02", ["art. 19", "artigo 19"], ["art. 21", "artigo 21"], "Res. ANM 95/2022"]
nao_contem = ["N13-03", "LO-02"]
ferramentas = [["pendencias", "ficha_do_ativo"]]

