# Tudo local, igual à AWS: Postgres (RDS), API (ECS Fargate) e o job do radar (EventBridge + Fargate).
#
#   docker compose up --build        # API em http://localhost:8000/docs, Postgres em localhost:5432
#   docker compose run --rm radar    # roda o radar do DOU uma vez
#   docker compose run --rm descoberta   # busca normas já publicadas nas fontes oficiais e tria pela IA
#
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mitra
      POSTGRES_USER: mitra
      POSTGRES_PASSWORD: mitra-local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitra -d mitra"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      MITRA_DATABASE_URL: postgresql://mitra:mitra-local@postgres:5432/mitra
      MITRA_COOKIE_SEGURO: "0"
      MITRA_ORIGENS: http://localhost:3000
      MITRA_TOKEN_SERVICO: ${MITRA_TOKEN_SERVICO:-token-local-do-agente}
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  radar:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["python", "-m", "api.jobs", "radar"]
    environment:
      MITRA_DATABASE_URL: postgresql://mitra:mitra-local@postgres:5432/mitra
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["jobs"]

  descoberta:
    # normas já publicadas que valem para a carteira: lê o Senado, o ANMlegis e a Assembleia de Minas e
    # passa as candidatas novas pela IA (fica para a curadoria Mitra aprovar ou descartar)
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["python", "-m", "api.jobs", "descoberta"]
    environment:
      MITRA_DATABASE_URL: postgresql://mitra:mitra-local@postgres:5432/mitra
    env_file:
      - path: .env
        required: false
    volumes:
      - fontes:/app/data/raw/fontes     # o que a fonte já devolveu de anos passados não é baixado de novo
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["jobs"]

volumes:
  pgdata:
  uploads:
  fontes:
