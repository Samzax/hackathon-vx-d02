# Lido quando o Streamlit roda a partir da raiz do repositório (local e no Docker).

[server]
# FIR, laudos e boletins são PDFs de texto pequenos; 20 MB sobra e limita o que entra.
maxUploadSize = 20

[client]
# sem o botão "Deploy" do Streamlit na tela da demo (o menu ⋮ continua)
toolbarMode = "minimal"

[browser]
# nada sai da máquina sem pedido: sem estatística de uso para o Streamlit
gatherUsageStats = false

# ---------------------------------------------------------------- identidade visual (provisória)
# Petróleo sóbrio, cara de software de engenharia. Cor só onde tem significado: a marca (ações) e o
# status das obrigações (vermelho atrasada, laranja vencendo, cinza dado faltando, verde em dia,
# azul por gatilho). A fonte vem do Google Fonts; sem internet, cai na fonte do sistema.
# Trocar a direção visual = trocar os valores abaixo (o app.py lê as cores de status daqui).

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, 'Segoe UI', sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, 'Segoe UI', sans-serif"
headingFontWeights = [650, 600, 600, 600, 600, 600]
baseFontSize = 15
baseRadius = "6px"
buttonRadius = "6px"
showWidgetBorder = true
metricValueFontWeight = 600

[theme.light]
primaryColor = "#1E6A80"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F7"
textColor = "#1B2128"
borderColor = "#E1E5EA"
dataframeHeaderBackgroundColor = "#F3F5F7"
linkColor = "#1E6A80"
redColor = "#C23B3B"
orangeColor = "#B8730F"
grayColor = "#6B7480"
greenColor = "#2B8452"
blueColor = "#2F6DB5"

[theme.light.sidebar]
backgroundColor = "#F3F5F7"

[theme.dark]
primaryColor = "#5AAFC6"
backgroundColor = "#0F1318"
secondaryBackgroundColor = "#171C23"
textColor = "#E4E7EB"
borderColor = "#262D36"
dataframeHeaderBackgroundColor = "#171C23"
linkColor = "#5AAFC6"
redColor = "#EE6E6E"
orangeColor = "#EBA244"
grayColor = "#9AA3AE"
greenColor = "#5BC08A"
blueColor = "#6EA3E6"

[theme.dark.sidebar]
backgroundColor = "#13181E"
